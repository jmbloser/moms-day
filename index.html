<style>
  :root{
    --bg:#EDF2EE;
    --card:#FFFFFF;
    --text:#1F2E2B;
    --text-soft:#4B5D57;
    --teal:#2F6F62;
    --teal-dark:#1B463C;
    --amber:#F6C453;
    --amber-text:#5C3D0A;
    --brick:#C1502E;
    --coral:#D96C4A;
    --blue:#3B6EA5;
    --plum:#7D5BA6;
    --border:#DEE7E1;
    --shadow:0 2px 14px rgba(31,46,43,0.08);
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    padding:8px 16px 8px;
  }
  h1,h2,h3{margin:0;}
  section.card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:12px 16px;
    margin-bottom:6px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    color:var(--teal);
    font-size:0.95rem;
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .eyebrow svg{width:19px;height:19px;flex:none;}

  /* ---------- Clock header ---------- */

  /* ---------- To-do ---------- */
  .todo-row{
    display:flex;

    padding:5px 0;

  .add-row input[type=text]{
    flex:1;

    padding:14px 14px;

  /* ---------- Contacts ---------- */

  .app-btn svg{width:23px;height:23px;flex:none;}
  .app-btn.mail{background:var(--blue);}

  footer.tiny{

    margin-top:6px;

  /* ---------- Caregiver view ---------- */
  .cg-wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px;}
  .cg-header{

  .field{margin-bottom:14px;}
  input[type=text],input[type=tel],input[type=date],input[type=time],input[type=password],input[type=url]{

    font-family:inherit;
    font-size:1.05rem;

  .cg-list-item{
    display:flex;align-items:center;gap:10px;

  .cg-list-item .grow{flex:1;font-size:1.05rem;}
  .cg-list-item .sub{color:var(--text-soft);font-size:0.9rem;}
  .icon-btn{
    flex:none;
    width:38px;height:38px;
    border-radius:10px;
    border:none;
    background:#F4E3DD;
    color:var(--brick);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn svg{width:18px;height:18px;}
  .contact-edit-row{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
    padding:14px 0;
    border-bottom:1px solid var(--border);

  .contact-edit-row:last-child{border-bottom:none;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--teal-dark);color:#fff;padding:10px 20px;border-radius:999px;
    font-weight:700;font-size:0.95rem;opacity:0;transition:opacity 0.25s ease;
    pointer-events:none;

  .toast.show{opacity:1;}

  /* ---------- PIN screen ---------- */
  .pin-wrap{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .pin-card{
    background:#fff;border-radius:24px;box-shadow:var(--shadow);
    padding:32px 26px;max-width:340px;width:100%;text-align:center;
  }
  .pin-card svg{width:44px;height:44px;color:var(--teal);margin-bottom:10px;}
  .pin-card h2{font-size:1.3rem;margin-bottom:6px;}
  .pin-card p{color:var(--text-soft);font-size:0.95rem;margin:0 0 18px;}
  .pin-input{
    width:100%;font-size:1.6rem;letter-spacing:0.5em;text-align:center;
    padding:14px;border-radius:14px;border:2px solid var(--border);margin-bottom:14px;

  .pin-error{color:var(--brick);font-size:0.9rem;margin-bottom:10px;min-height:1.2em;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>

<script>
/* ============ Icons ============ */
const ICONS = {
  calendar:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>`,

  mail:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg>`,
  message:`<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="4" width="18" height="13" rx="5"/><path d="M8.5 17 7 21l5-4z"/></svg>`,
  warn:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5h.01"/></svg>`,
  trash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>`,
  lock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
  gear:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  close:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`
};

/* ============ Firebase config ============ */
/* Paste the config object from Firebase Console > Project Settings > Your apps > SDK setup and configuration */
const firebaseConfig = {
  apiKey: "AIzaSyDspG_i-0a3osKTnNZDHYg7RJLB6kEgFLU",
  authDomain: "moms-day-5bbf9.firebaseapp.com",
  databaseURL: "https://moms-day-5bbf9-default-rtdb.firebaseio.com",
  projectId: "moms-day-5bbf9",
  storageBucket: "moms-day-5bbf9.firebasestorage.app",
  messagingSenderId: "159477701781",
  appId: "1:159477701781:web:a4d8a4ccbfbbd9a2590f9c"
};
const CONFIG_READY = firebaseConfig.apiKey && !String(firebaseConfig.apiKey).includes('PASTE');
let dbRef = null;

/* ============ Data ============ */
const DEFAULT_DATA = {
  pin: "1234",
  contacts: [
    {name:"Reed", phone:"", photo:"", color:"#2F6F62"},
    {name:"Amy", phone:"", photo:"", color:"#D96C4A"},
    {name:"Jim", phone:"", photo:"", color:"#3B6EA5"},
    {name:"Nate", phone:"", photo:"", color:"#7D5BA6"}
  ],
  helpContact: {name:"Call for Help", phone:""},
  reminders: [],
  events: [],
  todos: []
};

let DATA = null;
let pinVerified = false;
const params = new URLSearchParams(location.search);
const MODE = params.get('caregiver') === '1' ? 'caregiver' : 'mom';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function mergeDefaults(val){
  return Object.assign({}, DEFAULT_DATA, val || {});
}

async function saveData(){
  try{
    await dbRef.set(DATA);
    showToast('Saved');
  }catch(e){ console.error('save failed', e); showToast('Could not save — check connection'); }
}

function renderSetupNotice(){
  document.getElementById('app').innerHTML = `
    <div class="pin-wrap" style="min-height:70vh;">
      <div class="pin-card" style="max-width:380px;">
        ${ICONS.gear}
        <h2>Almost there</h2>
        <p style="text-align:left;">This app needs its Firebase details filled in before it can save or sync anything. Open <code>index.html</code>, find the <code>firebaseConfig</code> section near the top of the script, and paste in the config values from your Firebase project (Project Settings → Your apps → SDK setup and configuration). Then save and re-upload the file.</p>
      </div>
    </div>
  `;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ============ Date helpers ============ */
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDay(d){ return d.toLocaleDateString('en-US',{weekday:'long'}); }
function fmtDate(d){ return d.toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'}); }
function fmtTime(d){ return d.toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit'}); }
function partOfDay(d){
  const h = d.getHours();
  if(h<5) return 'Night';
  if(h<12) return 'Morning';
  if(h<17) return 'Afternoon';
  if(h<21) return 'Evening';
  return 'Night';
}
function fmtEventTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const d = new Date(); d.setHours(h,m,0,0);
  return fmtTime(d);
}
function fmtEventDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}

/* ============ Mom view ============ */
function updateClockNodes(){
  const now = new Date();
  const dayEl = document.getElementById('clockDay');
  if(!dayEl) return;
  document.getElementById('clockDay').textContent = fmtDay(now);
  document.getElementById('clockDate').textContent = fmtDate(now);
  document.getElementById('clockTime').textContent = fmtTime(now);
  document.getElementById('clockPart').textContent = partOfDay(now);
}

function contactInitial(name){ return (name||'?').trim().charAt(0).toUpperCase(); }

function buildContactsHtml(){
  return DATA.contacts.map(c=>{
    const has = !!c.phone;
    const avatarStyle = c.photo ? `style="background-image:url('${escapeAttr(c.photo)}')"` : '';
    return `<a class="contact-btn ${has?'':'disabled'}" style="background:${c.color}" href="${has?('tel:'+c.phone.replace(/[^0-9+]/g,'')):'#'}">
      <div class="contact-avatar" ${avatarStyle}>${c.photo?'':contactInitial(c.name)}</div>
      <div class="contact-name">${escapeHtml(c.name)}</div>
    </a>`;
  }).join('');
}

function renderCallSheet(){
  const sheet = document.getElementById('callSheet');
  if(!sheet) return;
  const help = DATA.helpContact;
  const helpHref = help.phone ? ('tel:'+help.phone.replace(/[^0-9+]/g,'')) : '#';
  sheet.innerHTML = `
    <div class="call-sheet-header">
      <h2>Who do you want to call?</h2>
      <button class="close-btn" onclick="closeCallSheet()" aria-label="Close">${ICONS.close}</button>
    </div>
    <div class="contacts-grid">${buildContactsHtml()}</div>
    <div class="help-btn-wrap">
      <a class="help-btn" href="${helpHref}">${ICONS.warn}${escapeHtml(help.name||'Call for Help')}</a>
    </div>
  `;
}
function openCallSheet(){
  renderCallSheet();
  const el = document.getElementById('callSheet');
  el.classList.add('open');
  el.setAttribute('aria-hidden','false');
}
function closeCallSheet(){
  const el = document.getElementById('callSheet');
  el.classList.remove('open');
  el.setAttribute('aria-hidden','true');
}

function renderMomView(){
  const now = new Date();
  const today = todayISO();
  const todaysEvents = DATA.events
    .filter(e=>e.date===today)
    .sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99'));

  const eventsHtml = todaysEvents.length ? todaysEvents.map(e=>`
    <div class="row">
      ${e.time ? `<span class="time-chip">${fmtEventTime(e.time)}</span>` : ''}
      <span>${escapeHtml(e.title)}</span>
    </div>`).join('') : `<div class="empty-msg">Nothing on the calendar today.</div>`;

  const remindersHtml = DATA.reminders.length ? DATA.reminders.map(r=>`
    <div class="row">${ICONS.pin.replace('<svg ','<svg style="width:20px;height:20px;flex:none;margin-top:2px;" ')}<span>${escapeHtml(r.text)}</span></div>
  `).join('') : `<div class="empty-msg">No reminders right now.</div>`;

  const todosHtml = DATA.todos.length ? DATA.todos.map(t=>`
    <div class="todo-row">
      <div class="todo-check ${t.done?'done':''}" onclick="toggleTodo('${t.id}')" role="checkbox" aria-checked="${t.done}" tabindex="0">${ICONS.check}</div>
      <div class="todo-text ${t.done?'done':''}">${escapeHtml(t.text)}</div>
    </div>
  `).join('') : `<div class="empty-msg">Nothing on your list yet.</div>`;

  document.getElementById('app').innerHTML = `
    <section class="card clock-card">
      <div class="clock-day" id="clockDay">${fmtDay(now)}</div>
      <div class="clock-date" id="clockDate">${fmtDate(now)}</div>
      <div class="clock-time" id="clockTime">${fmtTime(now)}</div>
      <div class="clock-part" id="clockPart">${partOfDay(now)}</div>
    </section>

    <section class="card">
      <div class="eyebrow">${ICONS.calendar}Today</div>
      ${eventsHtml}
      <div class="add-row">
        <input type="text" id="newEventInput" placeholder="Add something for today…" />
        <button class="btn" onclick="addEventFromInput()">Add</button>
      </div>
    </section>

    <section class="card reminders-card">
      <div class="eyebrow">${ICONS.pin}Reminders</div>
      ${remindersHtml}
      <div class="add-row">
        <input type="text" id="newReminderInput" placeholder="Add a reminder…" />
        <button class="btn" onclick="addReminderFromInput()">Add</button>
      </div>
    </section>

    <section class="card">
      <div class="eyebrow">${ICONS.list}To Do</div>
      ${todosHtml}
      <div class="add-row">
        <input type="text" id="newTodoInput" placeholder="Add something to do…" />
        <button class="btn" onclick="addTodoFromInput()">Add</button>
      </div>
    </section>

    <section class="card">
      <div class="eyebrow">${ICONS.phone}Call</div>
      <button class="call-open-btn" onclick="openCallSheet()">${ICONS.phone}Call Someone</button>
    </section>

    <div class="app-row">
      <a class="app-btn mail" href="mailto:">${ICONS.mail}Mail</a>
      <a class="app-btn messages" href="sms:">${ICONS.message}Messages</a>
    </div>

    <footer class="tiny">My Day</footer>
  `;

  const input = document.getElementById('newTodoInput');
  input.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'){ addTodoFromInput(); } });
  const evInput = document.getElementById('newEventInput');
  evInput.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'){ addEventFromInput(); } });
  const remInput = document.getElementById('newReminderInput');
  remInput.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'){ addReminderFromInput(); } });

  renderCallSheet();
}

async function toggleTodo(id){
  const t = DATA.todos.find(x=>x.id===id);
  if(!t) return;
  t.done = !t.done;
  await saveData();
  renderMomView();
}
async function addTodoFromInput(){
  const input = document.getElementById('newTodoInput');
  const val = input.value.trim();
  if(!val) return;
  DATA.todos.push({id:uid(), text:val, done:false});
  await saveData();
  renderMomView();
}
async function addEventFromInput(){
  const input = document.getElementById('newEventInput');
  const val = input.value.trim();
  if(!val) return;
  DATA.events.push({id:uid(), date: todayISO(), time:'', title: val});
  await saveData();
  renderMomView();
}
async function addReminderFromInput(){
  const input = document.getElementById('newReminderInput');
  const val = input.value.trim();
  if(!val) return;
  DATA.reminders.push({id:uid(), text: val});
  await saveData();
  renderMomView();
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* Real-time updates: Firebase pushes new data the instant any caregiver saves a change,
   so her screen (and every caregiver's screen) stays in sync with no polling needed. */
let firstLoad = true;
function handleRemoteUpdate(snapshot){
  const fresh = mergeDefaults(snapshot.val());
  DATA = fresh;
  if(MODE === 'caregiver'){
    if(firstLoad){
      renderCaregiverGate();
    }else if(pinVerified){
      renderCaregiverView();
    }
  }else{
    const ni = document.getElementById('newTodoInput');
    const typingValue = ni ? ni.value : '';
    renderMomView();
    const ni2 = document.getElementById('newTodoInput');
    if(ni2 && typingValue) ni2.value = typingValue;
  }
  firstLoad = false;
}

/* ============ Caregiver view ============ */
function renderCaregiverGate(){
  document.getElementById('app').outerHTML = `
    <div class="pin-wrap" id="app">
      <div class="pin-card">
        ${ICONS.lock}
        <h2>Caregiver Access</h2>
        <p>Enter the 4-digit code to add or update her day, reminders, to-dos and contacts.</p>
        <input class="pin-input" id="pinInput" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autofocus />
        <div class="pin-error" id="pinError"></div>
        <button class="btn block" onclick="checkPin()">Unlock</button>
      </div>
    </div>
  `;
  const pi = document.getElementById('pinInput');
  pi.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'){ checkPin(); } });
}
function checkPin(){
  const val = document.getElementById('pinInput').value.trim();
  if(val === (DATA.pin || '1234')){
    pinVerified = true;
    renderCaregiverView();
  }else{
    document.getElementById('pinError').textContent = 'That code is not correct — try again.';
  }
}

function renderCaregiverView(){
  const eventsList = DATA.events
    .slice()
    .sort((a,b)=> (a.date+((a.time)||'')).localeCompare(b.date+((b.time)||'')))
    .map(e=>`
    <div class="cg-list-item">
      <div class="grow">${escapeHtml(e.title)}<div class="sub">${fmtEventDate(e.date)}${e.time?(' · '+fmtEventTime(e.time)):''}</div></div>
      <button class="icon-btn" onclick="deleteEvent('${e.id}')" aria-label="Delete">${ICONS.trash}</button>
    </div>`).join('') || `<div class="empty-msg">No events added yet.</div>`;

  const remindersList = DATA.reminders.map(r=>`
    <div class="cg-list-item">
      <div class="grow">${escapeHtml(r.text)}</div>
      <button class="icon-btn" onclick="deleteReminder('${r.id}')" aria-label="Delete">${ICONS.trash}</button>
    </div>`).join('') || `<div class="empty-msg">No reminders added yet.</div>`;

  const todosList = DATA.todos.map(t=>`
    <div class="cg-list-item">
      <div class="todo-check ${t.done?'done':''}" style="width:28px;height:28px;" onclick="toggleTodo('${t.id}'); renderCaregiverView();">${ICONS.check}</div>
      <div class="grow ${t.done?'sub':''}" style="text-decoration:${t.done?'line-through':'none'}">${escapeHtml(t.text)}</div>
      <button class="icon-btn" onclick="deleteTodo('${t.id}')" aria-label="Delete">${ICONS.trash}</button>
    </div>`).join('') || `<div class="empty-msg">Nothing on the list yet.</div>`;

  const contactsEdit = DATA.contacts.map((c,i)=>`
    <div class="contact-edit-row">
      <div class="two-col">
        <div class="field"><span class="field-label">Name</span><input type="text" value="${escapeAttr(c.name)}" onchange="updateContact(${i},'name',this.value)"></div>
        <div class="field"><span class="field-label">Phone number</span><input type="tel" value="${escapeAttr(c.phone)}" placeholder="e.g. 555-123-4567" onchange="updateContact(${i},'phone',this.value)"></div>
      </div>
      <div class="field"><span class="field-label">Photo URL (optional)</span><input type="url" value="${escapeAttr(c.photo)}" placeholder="https://…" onchange="updateContact(${i},'photo',this.value)"></div>
    </div>
  `).join('');

  document.getElementById('app').outerHTML = `
    <div class="cg-wrap" id="app">
      <div class="cg-header">
        <h1>${ICONS.gear}<span>Caregiver Settings</span></h1>
      </div>
      <div class="cg-note">Changes here show up on her home screen automatically, usually within 30 seconds. You can share this same edit link with other family members helping out — anyone with it can make changes.</div>

      <section class="card">
        <div class="eyebrow">${ICONS.calendar}Today's & Upcoming Events</div>
        ${eventsList}
        <div class="field" style="margin-top:14px;">
          <div class="three-col">
            <input type="date" id="evDate">
            <input type="time" id="evTime">
            <input type="text" id="evTitle" placeholder="Event title">
          </div>
        </div>
        <button class="btn block" onclick="addEvent()">Add Event</button>
      </section>

      <section class="card">
        <div class="eyebrow">${ICONS.pin}Reminders</div>
        ${remindersList}
        <div class="add-row" style="margin-top:6px;">
          <input type="text" id="remText" placeholder="e.g. Nurse visits at 2pm today">
          <button class="btn" onclick="addReminder()">Add</button>
        </div>
      </section>

      <section class="card">
        <div class="eyebrow">${ICONS.list}To Do List</div>
        ${todosList}
        <div class="add-row" style="margin-top:6px;">
          <input type="text" id="cgTodoText" placeholder="Add a to-do item">
          <button class="btn" onclick="addTodoCaregiver()">Add</button>
        </div>
      </section>

      <section class="card">
        <div class="eyebrow">${ICONS.phone}Call Contacts</div>
        ${contactsEdit}
      </section>

      <section class="card">
        <div class="eyebrow">${ICONS.warn}Emergency / Help Button</div>
        <div class="two-col">
          <div class="field"><span class="field-label">Label</span><input type="text" value="${escapeAttr(DATA.helpContact.name)}" onchange="updateHelp('name',this.value)"></div>
          <div class="field"><span class="field-label">Phone number</span><input type="tel" value="${escapeAttr(DATA.helpContact.phone)}" onchange="updateHelp('phone',this.value)"></div>
        </div>
      </section>

      <section class="card">
        <div class="eyebrow">${ICONS.lock}Security Code</div>
        <div class="field"><span class="field-label">4-digit caregiver code</span><input type="tel" inputmode="numeric" maxlength="4" value="${escapeAttr(DATA.pin)}" onchange="updatePin(this.value)"></div>
      </section>

      <footer class="tiny">Her home screen link is this same page without <code>?caregiver=1</code> at the end.</footer>
    </div>
  `;
}

async function addEvent(){
  const date = document.getElementById('evDate').value;
  const time = document.getElementById('evTime').value;
  const title = document.getElementById('evTitle').value.trim();
  if(!date || !title){ showToast('Add a date and a title'); return; }
  DATA.events.push({id:uid(), date, time, title});
  await saveData();
  renderCaregiverView();
}
async function deleteEvent(id){
  DATA.events = DATA.events.filter(e=>e.id!==id);
  await saveData();
  renderCaregiverView();
}
async function addReminder(){
  const el = document.getElementById('remText');
  const val = el.value.trim();
  if(!val) return;
  DATA.reminders.push({id:uid(), text:val});
  await saveData();
  renderCaregiverView();
}
async function deleteReminder(id){
  DATA.reminders = DATA.reminders.filter(r=>r.id!==id);
  await saveData();
  renderCaregiverView();
}
async function addTodoCaregiver(){
  const el = document.getElementById('cgTodoText');
  const val = el.value.trim();
  if(!val) return;
  DATA.todos.push({id:uid(), text:val, done:false});
  await saveData();
  renderCaregiverView();
}
async function deleteTodo(id){
  DATA.todos = DATA.todos.filter(t=>t.id!==id);
  await saveData();
  renderCaregiverView();
}
async function updateContact(i, field, value){
  DATA.contacts[i][field] = value;
  await saveData();
}
async function updateHelp(field, value){
  DATA.helpContact[field] = value;
  await saveData();
}
async function updatePin(value){
  const v = value.trim();
  if(!/^\d{4}$/.test(v)){ showToast('Code must be 4 digits'); renderCaregiverView(); return; }
  DATA.pin = v;
  await saveData();
}

/* ============ Init ============ */
function init(){
  if(!CONFIG_READY){
    DATA = mergeDefaults(null);
    renderSetupNotice();
    return;
  }
  firebase.initializeApp(firebaseConfig);
  dbRef = firebase.database().ref('hub-data');
  dbRef.on('value', handleRemoteUpdate, (err)=>{
    console.error('Firebase read failed', err);
    showToast('Could not connect — check the Firebase setup');
  });
  if(MODE !== 'caregiver'){
    setInterval(updateClockNodes, 1000);
  }
}
init();
</script>
</body>
</html>
